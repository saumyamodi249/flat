<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="sat-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2d5236" />
      <stop offset="40%" stop-color="#1b3924" />
      <stop offset="80%" stop-color="#0e2316" />
      <stop offset="100%" stop-color="#08180f" />
    </radialGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a4352" />
      <stop offset="100%" stop-color="#0a2633" />
    </linearGradient>
  </defs>
  <!-- Satellite Base Terrain -->
  <rect width="120" height="120" fill="url(#sat-grad)" />
  
  <!-- Water body / lake -->
  <path d="M 75 10 C 95 15, 110 30, 115 55 C 105 70, 90 60, 80 45 C 70 30, 65 15, 75 10 Z" fill="url(#water)" opacity="0.85" />
  
  <!-- Roads & Arterials -->
  <path d="M -10 40 L 130 48" stroke="#5a655b" stroke-width="4" fill="none" opacity="0.75" />
  <path d="M 45 -10 L 52 130" stroke="#5a655b" stroke-width="3.5" fill="none" opacity="0.7" />
  <path d="M 10 95 L 130 90" stroke="#485349" stroke-width="2.5" fill="none" opacity="0.65" />
  <path d="M 85 45 L 95 130" stroke="#485349" stroke-width="2" fill="none" opacity="0.6" />

  <!-- Urban Building Blocks / Rooftops -->
  <rect x="12" y="14" width="16" height="18" fill="#445046" rx="1.5" opacity="0.85" />
  <rect x="15" y="17" width="10" height="12" fill="#58685b" rx="1" opacity="0.9" />
  
  <rect x="58" y="18" width="14" height="12" fill="#3d493f" rx="1" opacity="0.8" />
  <rect x="12" y="58" width="22" height="26" fill="#3a473c" rx="2" opacity="0.85" />
  <rect x="16" y="62" width="14" height="18" fill="#4e5f51" rx="1" opacity="0.9" />

  <rect x="60" y="60" width="18" height="16" fill="#425044" rx="1.5" opacity="0.85" />
  <rect x="63" y="63" width="12" height="10" fill="#57695a" rx="1" opacity="0.9" />

  <!-- Canopy / Greenery clusters -->
  <circle cx="36" cy="24" r="5" fill="#35663f" opacity="0.9" />
  <circle cx="39" cy="28" r="4" fill="#295432" opacity="0.9" />
  <circle cx="98" cy="80" r="7" fill="#2d5e37" opacity="0.9" />
  <circle cx="104" cy="84" r="6" fill="#234c2c" opacity="0.9" />

  <!-- Subtle overlay label badge -->
  <rect x="0" y="86" width="120" height="34" fill="#000000" opacity="0.55" />
  <text x="60" y="108" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.5">Satellite</text>
</svg>
